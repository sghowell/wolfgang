[build-system]
requires = [
  "scikit-build-core>=0.11",
  # Compiled into every wheel; third_party/nanobind/README.md and the SBOM name this version.
  "nanobind==3.1.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "wolfgang-quantum"
version = "0.2.3"
description = "C++20 and CUDA-backed accelerators for sparse sums of Pauli strings."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0 AND BSD-3-Clause"
license-files = [
  "LICENSE",
  "third_party/dlpack/LICENSE",
  "third_party/nanobind/LICENSE",
  "third_party/nanobind/robin_map_LICENSE",
  "third_party/onetbb/LICENSE.txt",
  "third_party/onetbb/third-party-programs.txt",
]
authors = [
  { name = "Wolfgang contributors" },
]
keywords = [
  "pauli",
  "quantum-computing",
  "hamiltonian",
  "cuda",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.23",
]

[project.urls]
Homepage = "https://github.com/sghowell/wolfgang"
Documentation = "https://sghowell.github.io/wolfgang/"
Repository = "https://github.com/sghowell/wolfgang.git"
Issues = "https://github.com/sghowell/wolfgang/issues"
Changelog = "https://github.com/sghowell/wolfgang/blob/main/CHANGELOG.md"

[project.optional-dependencies]
docs = [
  "mkdocs-material==9.7.7",
]
cudaq = [
  "cudaq>=0.11",
]
openfermion = [
  "openfermion>=1.7.1",
]
qiskit = [
  "qiskit>=1.0",
]
scipy = [
  "scipy>=1.10",
]
test = [
  "build>=1.2",
  "cibuildwheel>=2.23,<3; python_version < '3.11'",
  "cibuildwheel>=3.0,<4; python_version >= '3.11'",
  "cmake>=3.24",
  # Lets the SBOM schema-validation test run in CI, not only in release dispatches.
  "cyclonedx-python-lib[validation]>=11.12,<12",
  "hypothesis>=6.100",
  "nanobind==3.1.0",
  "ninja>=1.11",
  "pytest>=8",
  "scipy>=1.10",
  "tomli>=2; python_version < '3.11'",
  "trove-classifiers>=2026.4.28.13",
  "twine>=5",
]

[tool.scikit-build]
minimum-version = "0.11"
wheel.packages = ["python/wolfgang_quantum"]
sdist.exclude = [
  ".worktrees",
  ".release-candidates",
  "_skbuild",
  "build",
  "dist",
  "site",
  ".github",
  ".gitattributes",
  ".gitignore",
  "AGENTS.md",
  "CONTRIBUTING.md",
  "benchmarks",
  "bindings/python/internal_bindings.cpp",
  "docs",
  "ruff.toml",
  "scripts",
  "tests",
  "tools",
]

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*"]
skip = ["*-win32", "*-win_amd64", "*-win_arm64", "*-musllinux*", "pp*"]
# Wheels bundle oneTBB, built once per platform from a pinned commit.
before-all = "bash {project}/scripts/build_onetbb.sh /tmp/wolfgang-onetbb"
environment = { CMAKE_PREFIX_PATH = "/tmp/wolfgang-onetbb" }
test-command = "python {project}/scripts/wheel_smoke.py --require-tbb"

[tool.cibuildwheel.config-settings]
"cmake.define.WOLFGANG_ENABLE_INTERNAL_BINDINGS" = "OFF"
"cmake.define.WOLFGANG_ENABLE_CUDA" = "OFF"
"cmake.define.WOLFGANG_ENABLE_HIP" = "OFF"
"cmake.define.WOLFGANG_ENABLE_METAL" = "OFF"
"cmake.define.WOLFGANG_ENABLE_NATIVE" = "OFF"
# Fail the build rather than ship a scalar-only wheel if oneTBB is missing.
"cmake.define.WOLFGANG_ENABLE_TBB" = "ON"
# Record oneTBB's library directory so auditwheel and delocate can find it.
"cmake.define.CMAKE_INSTALL_RPATH_USE_LINK_PATH" = "ON"

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]
# Also reaches before-all, so the bundled oneTBB targets the wheel's minimum macOS.
environment = { CMAKE_PREFIX_PATH = "/tmp/wolfgang-onetbb", MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.codespell]
ignore-words-list = "aer,hsa,retuned,aligment"
skip = ".git,.venv,_skbuild,build,dist,site,.worktrees,.release-candidates,*.svg,uv.lock,./docs/javascripts/vendor/mermaid-11.4.1.min.js"
