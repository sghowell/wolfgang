name: Correctness or API bug
description: Report a reproducible Wolfgang defect
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not disclose vulnerabilities or private infrastructure here; use SECURITY.md."
  - type: input
    id: version
    attributes: {label: Wolfgang version, placeholder: "0.x.y or git revision"}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes: {label: Sanitized environment, description: "OS, architecture, Python, compiler, backend/runtime; remove addresses, tokens, usernames, and private paths."}
    validations: {required: true}
  - type: textarea
    id: reproducer
    attributes: {label: Minimal reproducer, render: python}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: observed
    attributes: {label: Observed behavior and complete error text}
    validations: {required: true}
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the support matrix and existing issues.
          required: true
        - label: I removed credentials and private infrastructure details.
          required: true
