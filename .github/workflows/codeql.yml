name: CodeQL

on:
  pull_request:
    paths:
      - "bindings/**"
      - "include/**"
      - "python/**"
      - "src/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none
    permissions:
      contents: read
      security-events: write # Required to upload CodeQL analysis results.
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Set up Python
        if: ${{ matrix.language == 'c-cpp' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        if: ${{ matrix.language == 'c-cpp' }}
        run: python -m pip install "scikit-build-core==0.11.6" "nanobind==2.9.2" "numpy==2.3.3"
      - name: Build CPU extension
        if: ${{ matrix.language == 'c-cpp' }}
        env:
          CMAKE_ARGS: >-
            -DWOLFGANG_ENABLE_CUDA=OFF
            -DWOLFGANG_ENABLE_HIP=OFF
            -DWOLFGANG_ENABLE_METAL=OFF
            -DWOLFGANG_ENABLE_NATIVE=OFF
        run: python -m pip install --no-build-isolation --verbose .
      - name: Analyze
        uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
