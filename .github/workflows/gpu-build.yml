name: GPU build

# Compile-only checks for the CUDA, HIP and Metal source builds. GitHub-hosted
# runners have no CUDA or ROCm GPUs, so those jobs build the extension inside
# pinned toolkit containers and stop at the link and symbol checks; hardware
# validation stays on real devices (docs/architecture/testing_and_ci.md, "GPU
# build CI"). Without these jobs a broken CUDA build went unnoticed on main for
# about ten weeks.
#
# Container digests are refreshed when the pinned toolkit version is bumped.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gpu-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda:
    name: CUDA 12.8 compile (sm_80, sm_90) with oneTBB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04@sha256:520292dbb4f755fd360766059e62956e9379485d9e073bbd2f6e3c20c270ed66
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils ca-certificates git libtbb-dev python3 python3-dev python3-venv unzip

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build the CUDA extension
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install \
            "scikit-build-core==0.11.6" "nanobind==2.9.2" "cmake==4.1.0" "ninja==1.13.0"
          /tmp/venv/bin/python -m pip wheel . --no-deps --no-build-isolation --wheel-dir /tmp/wheel \
            --config-settings=cmake.define.WOLFGANG_ENABLE_CUDA=ON \
            --config-settings=cmake.define.WOLFGANG_CUDA_ARCHITECTURES="80;90" \
            --config-settings=cmake.define.WOLFGANG_ENABLE_TBB=ON \
            --config-settings=cmake.define.WOLFGANG_ENABLE_INTERNAL_BINDINGS=ON

      # A shared object links even with undefined symbols, so a device method
      # defined for one backend but missing from another would only fail at
      # import on real hardware. Importing needs libcuda.so.1 from a driver,
      # which the container lacks, so check the symbol table instead.
      - name: Check for undefined Wolfgang symbols
        run: |
          mkdir /tmp/unpacked && unzip -q /tmp/wheel/*.whl -d /tmp/unpacked
          module=$(find /tmp/unpacked -name '_wolfgang_core*.so')
          if nm -D -C --undefined-only "$module" | grep -F 'wolfgang::'; then
            echo "undefined Wolfgang symbols in $module"; exit 1
          fi

  hip:
    name: ROCm 7.2 compile (gfx942)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: rocm/dev-ubuntu-24.04:7.2.4@sha256:bdc8e61026cbb844ede93d44d2c50055f51ebb2041906b60182bf3bee3139054
    env:
      PATH: /opt/rocm/bin:/opt/rocm/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils ca-certificates git python3 python3-dev python3-venv rocthrust-dev unzip
          dpkg -l | grep -E 'rocthrust|rocprim|hip-runtime' | awk '{print $2, $3}'

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build the HIP extension
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install \
            "scikit-build-core==0.11.6" "nanobind==2.9.2" "cmake==4.1.0" "ninja==1.13.0"
          /tmp/venv/bin/python -m pip wheel . --no-deps --no-build-isolation --wheel-dir /tmp/wheel \
            --config-settings=cmake.define.WOLFGANG_ENABLE_HIP=ON \
            --config-settings=cmake.define.WOLFGANG_HIP_ARCHITECTURES=gfx942 \
            --config-settings=cmake.define.WOLFGANG_ENABLE_INTERNAL_BINDINGS=ON

      - name: Check for undefined Wolfgang symbols
        run: |
          mkdir /tmp/unpacked && unzip -q /tmp/wheel/*.whl -d /tmp/unpacked
          module=$(find /tmp/unpacked -name '_wolfgang_core*.so')
          if nm -D -C --undefined-only "$module" | grep -F 'wolfgang::'; then
            echo "undefined Wolfgang symbols in $module"; exit 1
          fi

      # The HIP runtime library ships in the container, so the module can be
      # imported; with no GPU, status must report the runtime unavailable.
      - name: Import without a GPU
        run: |
          /tmp/venv/bin/python -m pip install "numpy==2.3.3" /tmp/wheel/*.whl
          cd /tmp && /tmp/venv/bin/python -c "
          import wolfgang_quantum._wolfgang_core as core
          info = core._build_info()
          assert info['hip_enabled'] is True, info
          status = core._hip_status()
          print(status)
          assert status['built'] is True
          "

  metal:
    name: Metal compile (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build the Metal extension
        run: |
          python -m pip install \
            "scikit-build-core==0.11.6" "nanobind==2.9.2" "cmake==4.1.0" "ninja==1.13.0"
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir /tmp/wheel \
            --config-settings=cmake.define.WOLFGANG_ENABLE_METAL=ON \
            --config-settings=cmake.define.WOLFGANG_ENABLE_INTERNAL_BINDINGS=ON

      - name: Check for undefined Wolfgang symbols
        run: |
          mkdir /tmp/unpacked && unzip -q /tmp/wheel/*.whl -d /tmp/unpacked
          module=$(find /tmp/unpacked -name '_wolfgang_core*.so')
          if nm -u -C "$module" | grep -F 'wolfgang::'; then
            echo "undefined Wolfgang symbols in $module"; exit 1
          fi

      - name: Import
        run: |
          python -m pip install "numpy==2.3.3" /tmp/wheel/*.whl
          cd /tmp && python -c "
          import wolfgang_quantum._wolfgang_core as core
          assert core._build_info()['metal_enabled'] is True
          print(core._metal_status())
          "
