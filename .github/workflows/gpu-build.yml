name: GPU build

# Compile-only checks for the CUDA and HIP source builds. GitHub-hosted runners
# have no GPUs, so these jobs build the extension inside pinned toolkit
# containers and stop there; hardware validation stays on real devices
# (docs/architecture/hardware_targets_and_testing.md). Without these jobs a
# broken CUDA build went unnoticed on main for about ten weeks.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gpu-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda:
    name: CUDA 12.8 compile (sm_90)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04@sha256:520292dbb4f755fd360766059e62956e9379485d9e073bbd2f6e3c20c270ed66
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-dev python3-venv

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build the CUDA extension
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --upgrade pip
          /tmp/venv/bin/python -m pip wheel . --no-deps --wheel-dir /tmp/wheel \
            --config-settings=cmake.define.WOLFGANG_ENABLE_CUDA=ON \
            --config-settings=cmake.define.WOLFGANG_CUDA_ARCHITECTURES=90 \
            --config-settings=cmake.define.WOLFGANG_ENABLE_INTERNAL_BINDINGS=ON
          ls -l /tmp/wheel

  hip:
    name: ROCm 7.2 compile (gfx942)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: rocm/dev-ubuntu-24.04:7.2.4@sha256:bdc8e61026cbb844ede93d44d2c50055f51ebb2041906b60182bf3bee3139054
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-dev python3-venv \
            rocthrust-dev rocprim-dev hipcub-dev

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build the HIP extension
        env:
          PATH: /opt/rocm/bin:/opt/rocm/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --upgrade pip
          /tmp/venv/bin/python -m pip wheel . --no-deps --wheel-dir /tmp/wheel \
            --config-settings=cmake.define.WOLFGANG_ENABLE_HIP=ON \
            --config-settings=cmake.define.WOLFGANG_HIP_ARCHITECTURES=gfx942 \
            --config-settings=cmake.define.WOLFGANG_ENABLE_INTERNAL_BINDINGS=ON
          ls -l /tmp/wheel
