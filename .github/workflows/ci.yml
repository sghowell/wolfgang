name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    env:
      FASTPAULI_ENABLE_CUDA: "OFF"
      FASTPAULI_ENABLE_NATIVE: "OFF"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Validate
        run: python scripts/validate.py

  cpu-wheel-smoke:
    name: CPU wheel smoke / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    env:
      FASTPAULI_ENABLE_CUDA: "OFF"
      FASTPAULI_ENABLE_HIP: "OFF"
      FASTPAULI_ENABLE_NATIVE: "OFF"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install release build tools
        run: python -m pip install --upgrade pip build cmake ninja

      - name: Build and smoke-test CPU release artifacts
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/fastpauli-release-artifacts
        run: python scripts/validate_release_artifacts.py --output-dir "${RELEASE_ARTIFACT_DIR}"

  qiskit-adapter:
    name: qiskit-adapter / Python 3.12 / ${{ matrix['qiskit-requirement'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        qiskit-requirement:
          - "qiskit==1.0"
          - "qiskit>=1.0"

    env:
      FASTPAULI_ENABLE_CUDA: "OFF"
      FASTPAULI_ENABLE_NATIVE: "OFF"
      QISKIT_REQUIREMENT: ${{ matrix['qiskit-requirement'] }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install Qiskit adapter extra
        run: python -m pip install -e ".[test]" "${QISKIT_REQUIREMENT}"

      - name: Test Qiskit adapter
        run: python -m pytest tests/test_qiskit_adapter.py

  openfermion-adapter:
    name: openfermion-adapter / Python 3.12 / ${{ matrix['openfermion-requirement'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        openfermion-requirement:
          - "openfermion==1.7.1"
          - "openfermion>=1.7.1"

    env:
      FASTPAULI_ENABLE_CUDA: "OFF"
      FASTPAULI_ENABLE_NATIVE: "OFF"
      OPENFERMION_REQUIREMENT: ${{ matrix['openfermion-requirement'] }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install OpenFermion adapter extra
        run: python -m pip install -e ".[test,openfermion]" "${OPENFERMION_REQUIREMENT}"

      - name: Test OpenFermion adapter
        run: python -m pytest tests/test_openfermion_adapter.py
