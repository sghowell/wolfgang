<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="876" viewBox="0 0 1120 876" role="img" aria-labelledby="title desc">
<title id="title">Wolfgang H100 backend speedups</title>
<desc id="desc">Representative default-profile speedups versus scalar CPU for all captured Wolfgang paths.</desc>
