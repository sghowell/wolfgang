<svg xmlns="http://www.w3.org/2000/svg" width="980" height="584" viewBox="0 0 980 584" role="img" aria-labelledby="title desc" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="title">Wolfgang against other libraries</title>
<desc id="desc">Left: simplify time against term count for Qiskit and Wolfgang. Qiskit SparsePauliOp.simplify: 2K 312 µs, 4K 563 µs, 8K 1.09 ms, 10K 1.35 ms, 30K 3.79 ms, 100K 12.4 ms, 1M 167 ms; Wolfgang, scalar: 2K 153 µs, 4K 319 µs, 8K 746 µs, 10K 944 µs, 30K 2.9 ms, 100K 10.4 ms, 1M 127 ms; Wolfgang, oneTBB 26 threads: 2K 140 µs, 4K 222 µs, 8K 386 µs, 10K 486 µs, 30K 1.12 ms, 100K 3.1 ms, 1M 29 ms. Right: speedup of Wolfgang over each library. vs Qiskit simplify (64 qubits, 10,000 terms): 1.3x; vs OpenFermion multiply (256 x 256 terms): 17.6x; vs Qiskit group_commuting (512 terms): 214.0x; vs cuStateVec expectation (14 qubits, 4,096 terms, H100): 39.8x</desc>
<style>
.bg { fill: #fcfcfb; } .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #75746f; }
.grid { stroke: #e4e3df; } .axis { stroke: #c9c8c3; }
.s-s1 { stroke: #2a78d6; } .f-s1 { fill: #2a78d6; } .s-s2 { stroke: #eb6834; } .f-s2 { fill: #eb6834; } .s-s3 { stroke: #1baf7a; } .f-s3 { fill: #1baf7a; } .s-s4 { stroke: #eda100; } .f-s4 { fill: #eda100; } .s-s5 { stroke: #e87ba4; } .f-s5 { fill: #e87ba4; } .s-neutral { stroke: #6f6e69; } .f-neutral { fill: #6f6e69; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; } .t1 { fill: #f2f1ed; } .t2 { fill: #b5b4ae; } .t3 { fill: #94938d; }
  .grid { stroke: #33322f; } .axis { stroke: #4a4945; }
  .s-s1 { stroke: #3987e5; } .f-s1 { fill: #3987e5; } .s-s2 { stroke: #d95926; } .f-s2 { fill: #d95926; } .s-s3 { stroke: #199e70; } .f-s3 { fill: #199e70; } .s-s4 { stroke: #c98500; } .f-s4 { fill: #c98500; } .s-s5 { stroke: #d55181; } .f-s5 { fill: #d55181; } .s-neutral { stroke: #a3a29d; } .f-neutral { fill: #a3a29d; }
}
