<text x="24.0" y="520.0" class="t3" font-size="12" text-anchor="start" font-weight="400">April comparisons, on an H100 PCIe host: Wolfgang&#x27;s scalar CPU kernels, except cuStateVec (Wolfgang CUDA, device-resident).</text>
<text x="24.0" y="538.0" class="t3" font-size="12" text-anchor="start" font-weight="400">Qiskit 2.4.1, OpenFermion 1.7.1, cuQuantum 24.8. November simplify: Qiskit 1.4.5.</text>
<text x="24.0" y="556.0" class="t3" font-size="12" text-anchor="start" font-weight="400">Sources: cpu_parallel_simplify_2026-11-03 and cuda_deep_optimization_h100_2026-04-28 (docs/benchmarks/).</text>
