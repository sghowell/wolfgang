<text x="529.7" y="153.0" class="t3" font-size="12" text-anchor="start" font-weight="400">(547 µs vs 689 µs)</text>
<text x="470.0" y="204.0" class="t1" font-size="12" text-anchor="start" font-weight="600">vs OpenFermion multiply</text>
<text x="643.6" y="204.0" class="t3" font-size="12" text-anchor="start" font-weight="400">256 x 256 terms</text>
