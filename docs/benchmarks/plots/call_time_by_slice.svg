<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-labelledby="title desc" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="title">Per-call times across the campaign slices</title>
<desc id="desc">Two panels, CUDA on an H100 and HIP on an MI300X; lines of per-call time across four steps. CUDA, H100: simplify, 128 terms 225 µs -&gt; 143 µs -&gt; 18.4 µs -&gt; 18.4 µs; simplify, 4,096 terms 276 µs -&gt; 190 µs -&gt; 188 µs -&gt; 108 µs; matmul, 128 x 128 301 µs -&gt; 204 µs -&gt; 202 µs -&gt; 123 µs; round trip, 128 terms (to_device, simplify, to_host) 1.17 ms -&gt; 189 µs -&gt; 63.6 µs -&gt; 63.7 µs; HIP, MI300X: simplify, 128 terms 255 µs -&gt; 155 µs -&gt; 26.9 µs -&gt; 27.1 µs; simplify, 4,096 terms 280 µs -&gt; 180 µs -&gt; 179 µs -&gt; 97.9 µs; matmul, 128 x 128 300 µs -&gt; 200 µs -&gt; 199 µs -&gt; 124 µs; round trip, 128 terms (to_device, simplify, to_host) 337 µs -&gt; 237 µs -&gt; 104 µs -&gt; 106 µs</desc>
<style>
.bg { fill: #fcfcfb; } .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #75746f; }
.grid { stroke: #e4e3df; } .axis { stroke: #c9c8c3; }
.s-s1 { stroke: #2a78d6; } .f-s1 { fill: #2a78d6; } .s-s2 { stroke: #eb6834; } .f-s2 { fill: #eb6834; } .s-s3 { stroke: #1baf7a; } .f-s3 { fill: #1baf7a; } .s-s4 { stroke: #eda100; } .f-s4 { fill: #eda100; } .s-s5 { stroke: #e87ba4; } .f-s5 { fill: #e87ba4; } .s-neutral { stroke: #6f6e69; } .f-neutral { fill: #6f6e69; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; } .t1 { fill: #f2f1ed; } .t2 { fill: #b5b4ae; } .t3 { fill: #94938d; }
  .grid { stroke: #33322f; } .axis { stroke: #4a4945; }
  .s-s1 { stroke: #3987e5; } .f-s1 { fill: #3987e5; } .s-s2 { stroke: #d95926; } .f-s2 { fill: #d95926; } .s-s3 { stroke: #199e70; } .f-s3 { fill: #199e70; } .s-s4 { stroke: #c98500; } .f-s4 { fill: #c98500; } .s-s5 { stroke: #d55181; } .f-s5 { fill: #d55181; } .s-neutral { stroke: #a3a29d; } .f-neutral { fill: #a3a29d; }
}
</style>
<rect class="bg" width="980" height="600"/>
<text x="24.0" y="38.0" class="t1" font-size="20" text-anchor="start" font-weight="600">Per-call times across the campaign slices</text>
<text x="24.0" y="62.0" class="t2" font-size="13" text-anchor="start" font-weight="400">Median time of one call on small device-resident operators (24 qubits), after each slice that changed it. Log scale.</text>
