<text x="90.0" y="556.0" class="t3" font-size="11" text-anchor="start" font-weight="400">Sources: cuda_allocation_reuse, hip_parity, small_simplify, cuda_device_counts and hip_device_counts reports (docs/benchmarks/).</text>
