<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="284" viewBox="0 0 1060 284" role="img" aria-labelledby="title desc">
<title id="title">Campaign 4 Duplicate Reduction A/B</title>
<desc id="desc">CUB radix-sort prototype speedup versus default CUDA simplify; higher is better.</desc>
