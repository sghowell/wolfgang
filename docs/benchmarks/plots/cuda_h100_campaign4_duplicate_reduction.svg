<text x="672.4" y="148.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">0.85x</text>
<text x="32.0" y="182.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">oneword high duplicate terms 200000</text>
