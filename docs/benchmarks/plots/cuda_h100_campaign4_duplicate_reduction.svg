<text x="32.0" y="62.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">CUB radix-sort prototype speedup versus default CUDA simplify; higher is better.</text>
<text x="32.0" y="114.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">oneword low duplicate terms 200000</text>
