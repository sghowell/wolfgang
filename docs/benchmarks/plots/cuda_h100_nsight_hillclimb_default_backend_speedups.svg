<svg xmlns="http://www.w3.org/2000/svg" width="960" height="814" viewBox="0 0 960 814" role="img" aria-labelledby="title desc">
<title id="title">FastPauli H100 CUDA backend speedups</title>
<desc id="desc">CPU scalar, optimized CPU, CUDA transfer-inclusive, and CUDA device-resident speedups versus CPU scalar from the checked-in H100 CUDA benchmark default report.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="32" y="34" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">H100 CUDA default backend speedups</text>
<text x="32" y="58" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Compared with CPU scalar on the same deterministic dataset; bar lengths use log scale.</text>
<text x="32" y="78" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Source: docs/benchmarks/reports/cuda_h100_nsight_hillclimb_2026-04-28.md</text>
<line x1="270" y1="94" x2="800" y2="94" stroke="#d1d5db"/>
<text x="270" y="88" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">1x</text>
<text x="800" y="88" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#6b7280">641x</text>
<text x="32" y="120" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">simplify duplicate pressure</text>
<text x="32" y="138" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">num_qubits=16; num_terms=50000; duplicate_rate=0.9801; duplicate_pool_size=1024; term_weight=3</text>
<rect x="270" y="150" width="2.00" height="16" rx="2" fill="#6b7280"/>
<text x="282.00" y="162" font-family="Arial, sans-serif" font-size="12" fill="#111827">CPU scalar 1.00x (0.0068 s)</text>
<rect x="270" y="174" width="156.46" height="16" rx="2" fill="#2563eb"/>
<text x="434.46" y="186" font-family="Arial, sans-serif" font-size="12" fill="#111827">CUDA transfer 6.74x (0.0010 s)</text>
<rect x="270" y="198" width="203.32" height="16" rx="2" fill="#059669"/>
<text x="481.32" y="210" font-family="Arial, sans-serif" font-size="12" fill="#111827">CUDA resident 11.9x (0.0006 s)</text>
<text x="32" y="262" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">statevector expectation</text>
<text x="32" y="280" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">num_qubits=12; num_terms=2048; duplicate_rate=0.15966796875; duplicate_pool_size=2048; statevector_length=4096; term_weight=3</text>
<rect x="270" y="292" width="2.00" height="16" rx="2" fill="#6b7280"/>
<text x="282.00" y="304" font-family="Arial, sans-serif" font-size="12" fill="#111827">CPU scalar 1.00x (0.0351 s)</text>
<rect x="270" y="316" width="473.73" height="16" rx="2" fill="#2563eb"/>
<text x="751.73" y="328" font-family="Arial, sans-serif" font-size="12" fill="#111827">CUDA transfer 323x (0.0001 s)</text>
<rect x="270" y="340" width="530.00" height="16" rx="2" fill="#059669"/>
<text x="808.00" y="352" font-family="Arial, sans-serif" font-size="12" fill="#111827">CUDA resident 641x (5.48e-05 s)</text>
<text x="32" y="404" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">pairwise commutation</text>
<text x="32" y="422" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">num_qubits=16; lhs_terms=2048; rhs_terms=2048; entries=4194304; term_weight=3</text>
<rect x="270" y="434" width="2.00" height="16" rx="2" fill="#6b7280"/>
<text x="282.00" y="446" font-family="Arial, sans-serif" font-size="12" fill="#111827">CPU scalar 1.00x (0.0199 s)</text>
<rect x="270" y="458" width="193.49" height="16" rx="2" fill="#7c3aed"/>
<text x="471.49" y="470" font-family="Arial, sans-serif" font-size="12" fill="#111827">CPU tbb 10.6x (0.0019 s)</text>
<rect x="270" y="482" width="168.32" height="16" rx="2" fill="#7c3aed"/>
<text x="446.32" y="494" font-family="Arial, sans-serif" font-size="12" fill="#111827">CPU avx512 7.79x (0.0026 s)</text>
<rect x="270" y="506" width="130.89" height="16" rx="2" fill="#7c3aed"/>
<text x="408.89" y="518" font-family="Arial, sans-serif" font-size="12" fill="#111827">CPU avx2 4.93x (0.0040 s)</text>
<rect x="270" y="530" width="213.34" height="16" rx="2" fill="#2563eb"/>
<text x="491.34" y="542" font-family="Arial, sans-serif" font-size="12" fill="#111827">CUDA transfer 13.5x (0.0015 s)</text>
<rect x="270" y="554" width="307.65" height="16" rx="2" fill="#059669"/>
<text x="585.65" y="566" font-family="Arial, sans-serif" font-size="12" fill="#111827">CUDA resident 42.6x (0.0005 s)</text>
<text x="32" y="618" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">matmul product generation simplify</text>
<text x="32" y="636" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">num_qubits=12; lhs_terms=256; rhs_terms=256; intermediate_terms=65536; term_weight=3</text>
<rect x="270" y="648" width="2.00" height="16" rx="2" fill="#6b7280"/>
<text x="282.00" y="660" font-family="Arial, sans-serif" font-size="12" fill="#111827">CPU scalar 1.00x (0.0114 s)</text>
<rect x="270" y="672" width="157.11" height="16" rx="2" fill="#2563eb"/>
<text x="435.11" y="684" font-family="Arial, sans-serif" font-size="12" fill="#111827">CUDA transfer 6.79x (0.0017 s)</text>
<rect x="270" y="696" width="201.62" height="16" rx="2" fill="#059669"/>
<text x="479.62" y="708" font-family="Arial, sans-serif" font-size="12" fill="#111827">CUDA resident 11.7x (0.0010 s)</text>
<rect x="32" y="786" width="14" height="14" fill="#6b7280"/>
<text x="52" y="797" font-family="Arial, sans-serif" font-size="12" fill="#374151">CPU scalar</text>
<rect x="148" y="786" width="14" height="14" fill="#7c3aed"/>
<text x="168" y="797" font-family="Arial, sans-serif" font-size="12" fill="#374151">CPU optimized</text>
<rect x="302" y="786" width="14" height="14" fill="#2563eb"/>
<text x="322" y="797" font-family="Arial, sans-serif" font-size="12" fill="#374151">CUDA transfer-inclusive</text>
<rect x="516" y="786" width="14" height="14" fill="#059669"/>
<text x="536" y="797" font-family="Arial, sans-serif" font-size="12" fill="#374151">CUDA device-resident</text>
</svg>
