<text x="24.0" y="38.0" class="t1" font-size="20" text-anchor="start" font-weight="600">Simplify time by backend and operator size</text>
<text x="24.0" y="62.0" class="t2" font-size="13" text-anchor="start" font-weight="400">Median time per call, 24 qubits, log-log. Accelerator times are device-resident (operator already on the device).</text>
<text x="24.0" y="82.0" class="t2" font-size="13" text-anchor="start" font-weight="400">Where a line sits below CPU scalar, that backend is faster at that size.</text>
