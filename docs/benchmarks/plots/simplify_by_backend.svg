<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-labelledby="title desc" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="title">Simplify time by backend and operator size</title>
<desc id="desc">Log-log lines of simplify time against term count. CPU scalar (Xeon 8480+): 128 terms 6.38 µs, 2K terms 153 µs, 4K terms 319 µs, 8K terms 746 µs, 10K terms 944 µs, 30K terms 2.9 ms, 100K terms 10.4 ms, 1M terms 127 ms; CPU oneTBB, 26 threads (Xeon): 2K terms 140 µs, 4K terms 222 µs, 8K terms 386 µs, 10K terms 486 µs, 30K terms 1.12 ms, 100K terms 3.1 ms, 1M terms 29 ms; CUDA, H100: 128 terms 18.4 µs, 1.024K terms 35.4 µs, 4.096K terms 108 µs, 50K terms 166 µs, 1M terms 388 µs; HIP, MI300X: 128 terms 27.1 µs, 1.024K terms 44.9 µs, 4.096K terms 97.9 µs, 50K terms 158 µs, 1M terms 579 µs; Metal, M4 Pro: 12.288K terms 538 µs, 16.384K terms 589 µs, 65.536K terms 1.71 ms, 262.144K terms 6.46 ms, 1.04858M terms 19.9 ms, 4.1943M terms 81.8 ms</desc>
<style>
