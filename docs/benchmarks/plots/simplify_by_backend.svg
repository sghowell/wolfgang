<text x="24.0" y="540.0" class="t3" font-size="11" text-anchor="start" font-weight="400">128-4,096 terms on CUDA and HIP, and 128 terms on the CPU: distinct terms, one call (call-overhead suite). Other points: half of the terms are duplicates.</text>
<text x="24.0" y="558.0" class="t3" font-size="11" text-anchor="start" font-weight="400">Metal runs its GPU-sort hybrid from 12,288 terms; below that the public path is the CPU. CPU on a Xeon 8480+ host (the H100&#x27;s); Metal on an Apple M4 Pro.</text>
<text x="24.0" y="576.0" class="t3" font-size="11" text-anchor="start" font-weight="400">Sources: cpu_parallel_simplify, cuda_device_counts, hip_device_counts, metal_hybrid_simplify and metal_followups reports (docs/benchmarks/).</text>
