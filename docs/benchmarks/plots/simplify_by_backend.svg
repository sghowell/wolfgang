<text x="24.0" y="38.0" class="t1" font-size="20" text-anchor="start" font-weight="600">Simplify time by host and operator size</text>
<text x="24.0" y="62.0" class="t2" font-size="13" text-anchor="start" font-weight="400">Median time per call at 24 qubits, log-log. Each panel is one host, and its CPU lines ran on that host.</text>
